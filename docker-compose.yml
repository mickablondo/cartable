services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      POSTGRES_DB: cartable
      POSTGRES_PASSWORD: cartable
      POSTGRES_USER: cartable
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_data:
