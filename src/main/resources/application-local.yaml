spring:
  http:
    clients:
      connect-timeout: ${CARTABLE_VISION_CONNECT_TIMEOUT:5s}
      read-timeout: ${CARTABLE_VISION_READ_TIMEOUT:5m}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${CARTABLE_CHAT_MODEL:qwen3:8b}
      embedding:
        model: ${CARTABLE_EMBEDDING_MODEL:bge-m3}

cartable:
  vision:
    model: ${VISION_MODEL:qwen2.5vl:7b}
    max-image-pixels: ${CARTABLE_VISION_MAX_IMAGE_PIXELS:12845056}
    jpeg-quality: ${CARTABLE_VISION_JPEG_QUALITY:1.0}
