spring:
  application:
    name: cartable
  profiles:
    default: local
  ai:
    vectorstore:
      pgvector:
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
cartable:
  course:
    data-directory: ${CARTABLE_DATA_DIRECTORY:data}
